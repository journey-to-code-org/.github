<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 969" width="840" height="969" role="img" aria-labelledby="title tech-stack-description" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><title id="title">Tech stack of journey-to-code-org</title><desc id="tech-stack-description">Mostly JavaScript, TypeScript and Rust. 105 of 105 public repositories updated in the last year. Used together: Angular + React + SolidJS + Svelte (1 repository, 2026 to now); Angular + React + SolidJS + Vue (1 repository, 2026 to now); Angular + React + Svelte + Vue (1 repository, 2026 to now); Angular + SolidJS + Svelte + Vue (1 repository, 2026 to now). Languages and technologies: JavaScript (101 repositories, 2026 to now); Rust (6 repositories, 2026 to now); Docker (2 repositories, 2026 to now); TypeScript (6 repositories, 2026 to now); CSS (5 repositories, 2026 to now); HTML (4 repositories, 2026 to now); React (3 repositories, 2026 to now); Python (3 repositories, 2026 to now); Vue (2 repositories, 2026 to now); C (2 repositories, 2026 to now). Testing and build tools: Vitest, Vite, Playwright. Projects to start with: open.blog, An open-source, self-hosted blogging platform built with native web technologies, portable themes, and a focus on owning your content. Built with Rust, Docker. Live at openblog.journeytocode.io. Active 2026 to now; open.parlor, Fifty-six multiplayer card, board, word and arcade games to host for family and friends. Also the real-world test of Zubra across React, Vue, Svelte, Solid and Angular. Built with TypeScript, React, Vue, Angular, SolidJS. Live at openparlor.journeytocode.io. Active 2026 to now; open.relay, Let people report a bug or ask for a feature from inside your app, with no GitHub account. Your server turns what they send into an issue. Built with TypeScript, React. Live at journey-to-code-org.github.io/open.relay. Active 2026 to now. Counted from 105 of 107 public repositories on 2026-11-25. Declared in manifests, which does not prove use. Public repositories only.</desc><rect width="840" height="969" rx="14" fill="#050819"/><text x="28" y="46" font-size="20" fill="#eef1f8" font-weight="700" text-anchor="start">Tech stack · @journey-to-code-org</text><text x="28" y="70" font-size="13.5" fill="#bcc5d8" font-weight="400" text-anchor="start">Mostly JavaScript, TypeScript and Rust. 105 of 105 public repositories updated in the last year.</text><text x="28" y="106" font-size="10.5" fill="#8f9ab3" font-weight="700" text-anchor="start">USED TOGETHER</text><text x="28" y="134" font-size="14" fill="#eef1f8" font-weight="600" text-anchor="start">Angular + React + SolidJS + Svelte</text><text x="812" y="134" font-size="13" fill="#bcc5d8" font-weight="400" text-anchor="end">1 repository · 2026–now</text><text x="28" y="150" font-size="11.5" fill="#8f9ab3" font-weight="400" text-anchor="start">See open.parlor</text><text x="28" y="172" font-size="14" fill="#eef1f8" font-weight="600" text-anchor="start">Angular + React + SolidJS + Vue</text><text x="812" y="172" font-size="13" fill="#bcc5d8" font-weight="400" text-anchor="end">1 repository · 2026–now</text><text x="28" y="188" font-size="11.5" fill="#8f9ab3" font-weight="400" text-anchor="start">See open.parlor</text><text x="28" y="210" font-size="14" fill="#eef1f8" font-weight="600" text-anchor="start">Angular + React + Svelte + Vue</text><text x="812" y="210" font-size="13" fill="#bcc5d8" font-weight="400" text-anchor="end">1 repository · 2026–now</text><text x="28" y="226" font-size="11.5" fill="#8f9ab3" font-weight="400" text-anchor="start">See open.parlor</text><text x="28" y="248" font-size="14" fill="#eef1f8" font-weight="600" text-anchor="start">Angular + SolidJS + Svelte + Vue</text><text x="812" y="248" font-size="13" fill="#bcc5d8" font-weight="400" text-anchor="end">1 repository · 2026–now</text><text x="28" y="264" font-size="11.5" fill="#8f9ab3" font-weight="400" text-anchor="start">See open.parlor</text><text x="28" y="292" 