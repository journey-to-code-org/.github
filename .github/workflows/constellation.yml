name: Daily tech stack constellation

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Draw the design for this date (YYYY-MM-DD). Leave empty for today.'
        required: false

# Publishes to the `output` branch; it never touches main.
permissions:
  contents: write

# One run at a time, so two never push to `output` at once.
concurrency:
  group: constellation-output
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      TECH_STACK_DESIGN: ${{ github.workspace }}/tech-stack-design.json
    steps:
      - uses: actions/checkout@v4

      # Constellation's own source, pinned so the patch below always fits.
      - uses: actions/checkout@v4
        with:
          repository: mnichols08/constellation
          ref: v5.5.0
          path: _constellation

      # The tech stack map ignores design settings, so pick a design from the date
      # (new look, new motion) and have the map read it. What the map shows never changes.
      - name: Pick today's design
        run: node .github/scripts/randomize-design.mjs _constellation "$TECH_STACK_DESIGN" "${{ inputs.date }}"

      - uses: ./_constellation
        with:
          username: journey-to-code-org
          tech-stack: 'true'
          tech-stack-style: map
          output: tech-stack.svg
          publish: 'true'
