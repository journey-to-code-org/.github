name: Latest articles

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

# The action rewrites the list in the profile README and commits it.
permissions:
  contents: write

jobs:
  update-readme:
    name: Update the profile README with the latest articles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://journeytocode.io/rss.xml"
          readme_path: profile/README.md
          template: "$newline- [$title]($url) — $description"
          description_max_length: 120
          max_post_count: 5
          commit_message: "Update latest articles"
